# The helloworld example as it ships: a Workflow calling HelloAgent, no LLM. It is the
# `lifecycle` workflow: the one that runs the CLI's status, logs, doctor, sync and teardown.
source: examples/helloworld/helloworld
query: World
calls: {Workflow.main: 1, HelloAgent.hello: 1}
traits: [lifecycle, quick, text-query]
timeout: 120
