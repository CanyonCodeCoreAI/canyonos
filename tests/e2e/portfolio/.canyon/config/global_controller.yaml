# Where every replica runs: `local` (this machine), `ec2-pool` (machines from `ec2-pool:`) or `ec2-assign`.
provider: local

agents:
  - name: IntentAgent
    entrypoint: agents/intent_agent.py
    replicas: 1
    resources:
      cpu: 1
      memory: 256
    requirements:
      - boto3>=1.43.91,<2.0
    functions:
      - name: parse
        arguments:
          - name: query
            type: str
        returns:
          type: dict

  - name: PriceAgent
    entrypoint: agents/price_agent.py
    replicas: 1
    resources:
      cpu: 1
      memory: 256
    requirements:
      - yfinance>=0.2.40,<2.0
    functions:
      - name: get_history
        arguments:
          - name: ticker
            type: str
          - name: lookback_days
            type: int
        returns:
          type: dict

  - name: MetricsAgent
    entrypoint: agents/metrics_agent.py
    replicas: 1
    resources:
      cpu: 1
      memory: 256
    requirements: []
    functions:
      - name: compute
        arguments:
          - name: ticker
            type: str
          - name: lookback_days
            type: int
        returns:
          type: dict

  - name: RiskAgent
    entrypoint: agents/risk_agent.py
    replicas: 1
    resources:
      cpu: 1
      memory: 256
    requirements: []
    functions:
      - name: assess
        arguments:
          - name: holdings
            type: dict
          - name: metrics
            type: dict
        returns:
          type: dict

  - name: AdvisorAgent
    entrypoint: agents/advisor_agent.py
    replicas: 1
    resources:
      cpu: 1
      memory: 512
    requirements:
      - boto3>=1.43.91,<2.0
    functions:
      - name: summarize
        arguments:
          - name: holdings
            type: dict
          - name: metrics
            type: dict
          - name: risk
            type: dict
        returns:
          type: str

  - name: Workflow
    entrypoint: agents/workflow.py
    replicas: 1
    requirements: []
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

endpoint:
  api_port: 8080
  agent: Workflow
  method: main

poll_interval: 4

redis:
  host: localhost
  port: 6379
  db: 0

otel:
  destinations:
    - name: local
      protocol: http
      endpoint: http://host.docker.internal:3000
      headers: {}
