# The app tests/e2e/ec2_pool.sh deploys onto a pool of EC2 machines. The agents are
# placed in this order, and their resources make every placement predictable:
# Workflow fills a machine's CPU on its own, SlowAgent and Big take one machine each,
# and Small then joins SlowAgent, since Big's machine has the least CPU in use but the
# most memory.

provider: EC2

agents:
  - name: Workflow
    resources:
      cpu: 2
      memory: 256
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: seconds
            type: str
        returns:
          type: dict

  - name: SlowAgent
    resources:
      cpu: 0.8
      memory: 256
    entrypoint: agents/slow_agent.py
    functions:
      - name: wait
        arguments:
          - name: seconds
            type: int
        returns:
          type: int

  - name: Big
    resources:
      cpu: 0.25
      memory: 900
    entrypoint: agents/big.py
    functions:
      - name: ping
        returns:
          type: str

  - name: Small
    resources:
      cpu: 0.25
      memory: 128
    entrypoint: agents/small.py
    functions:
      - name: ping
        returns:
          type: str

endpoint:
  api_port: 8090
  agent: Workflow
  method: main

poll_interval: 5
logs: true

redis:
  host: localhost
  port: 6390
  db: 0

ec2:
  region: ${EC2_REGION}
  machine_type:
    t3.micro: 2
    # A type named by a variable is filled in like any other ${...} value.
    ${EC2_POOL_SMALL_TYPE}: 1
  market_type: on-demand
  subnet_id: ${EC2_SUBNET_ID}
  security_group_ids:
    - ${EC2_SECURITY_GROUP_ID}
