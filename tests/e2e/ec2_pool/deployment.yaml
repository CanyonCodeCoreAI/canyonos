# The settings every project of the deployment shares. Each project's agents and
# routes are in its config/workflow_config.yaml.

provider: ec2-pool

endpoint:
  api_port: 8090

poll_interval: 5

logs: true

redis:
  host: localhost
  port: 6390
  db: 0

ec2-pool:
  region: ${EC2_REGION}
  machine_type:
    t3.micro: 2
    # A type named by a variable is filled in like any other ${...} value.
    ${EC2_POOL_SMALL_TYPE}: 1
  market_type: on-demand
  subnet_id: ${EC2_SUBNET_ID}
  security_group_ids:
    - ${EC2_SECURITY_GROUP_ID}
