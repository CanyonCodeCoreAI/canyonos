apiVersion: v1
kind: ServiceAccount
metadata:
  name: canyonos-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
---
# The CanyonOS API's (templates/dashboard.yaml), with the rights of the ClusterRole
# canyonos-api.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canyonos-api
  namespace: {{ .Values.dashboard.namespace }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
