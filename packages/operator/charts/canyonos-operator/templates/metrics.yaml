{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: canyonos-controller-manager-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  ports:
    - {name: https, port: 8443, targetPort: 8443, protocol: TCP}
  selector:
    {{- include "canyonos.selector" . | nindent 4 }}
---
# The metrics endpoint checks each caller's token and permission with the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyonos-metrics-auth
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canyonos-metrics-auth
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: canyonos-metrics-auth
subjects:
  - kind: ServiceAccount
    name: canyonos-controller-manager
    namespace: {{ .Release.Namespace }}
---
# Grant to whatever scrapes the operator (e.g. Prometheus's ServiceAccount).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyonos-metrics-reader
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- end }}
