# The CanyonOS API, which every install has: `canyonos deploy` runs each workflow group
# through it, and it is the cluster dashboard's backend. With it, Postgres and, with
# dashboard.enabled, the web front end, as `canyonos serve` runs them on Docker. Nothing
# is exposed outside the cluster: every signed-in user may port-forward to the API, which
# checks with Kubernetes what each caller may do with a workflow group, and answers the
# dashboard's routes only with the key dashboard.apiKeyHash is the hash of.
{{- $ns := .Values.dashboard.namespace }}
{{- $secret := .Values.dashboard.existingSecret | default "canyonos-dashboard" }}
{{- $apiKeyHash := .Values.dashboard.apiKeyHash | default "" }}
{{- if and $apiKeyHash (not (regexMatch "^[0-9a-f]{64}$" $apiKeyHash)) }}
{{- fail "dashboard.apiKeyHash must be the sha256 of the API key: 64 lowercase hex characters" }}
{{- end }}
{{- /* The forward rule below lets every signed-in user, every pod's service account
included, reach the API: without a key its dashboard routes would answer each of them. */}}
{{- if not (or $apiKeyHash .Values.dashboard.existingSecret) }}
{{- fail "dashboard.apiKeyHash is required: the sha256 of the CanyonOS API's key, as 64 lowercase hex characters (or dashboard.existingSecret with an api-key-hash), since every signed-in user may port-forward to the API" }}
{{- end }}
{{- /* Rolls the API when the chart's key changes. Salted with a value of the Secret, so
the annotation, readable by anyone who may view the Deployment, tests no key guess. */}}
{{- $apiKeyVersion := "" }}
{{- $apiImage := .Values.dashboard.apiImage | default (include "canyonos.releaseImage" (list . "api")) }}
{{- $coreImage := .Values.controllerImage | default (include "canyonos.releaseImage" (list . "core")) }}
{{- $webImage := .Values.dashboard.webImage | default (include "canyonos.releaseImage" (list . "web")) }}
{{- if .Values.dashboard.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
---
{{- end }}
{{- if not .Values.dashboard.existingSecret }}
{{- /* Generated on install, then kept: upgrades read it back (lookup) and an uninstall
leaves it, as it leaves Postgres's data. Tools that render without the cluster (helm
template, Argo CD) cannot read it back and would make a new password Postgres refuses:
they set dashboard.existingSecret instead. */}}
{{- $existing := lookup "v1" "Secret" $ns $secret }}
{{- $redisPasswordKey := randAlphaNum 48 | b64enc }}
{{- if $existing }}
{{- /* Added after the first releases: a Secret made before it gets one on upgrade. */}}
{{- $redisPasswordKey = index $existing.data "redis-password-key" | default $redisPasswordKey }}
{{- end }}
{{- $apiKeyVersion = printf "%s:%s" $redisPasswordKey $apiKeyHash | sha256sum }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  {{- if $existing }}
  db-password: {{ index $existing.data "db-password" }}
  {{- else }}
  db-password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  redis-password-key: {{ $redisPasswordKey }}
  api-key-hash: {{ $apiKeyHash | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: canyonos-dashboard-db
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: canyonos-dashboard-db}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: canyonos-dashboard-db
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  serviceName: canyonos-dashboard-db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: canyonos-dashboard-db}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  template:
    metadata:
      labels:
        {{- include "canyonos.podLabels" (list . (dict "app.kubernetes.io/name" "canyonos-dashboard-db" "app.kubernetes.io/part-of" "canyonos")) | trim | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- if .Values.dashboard.fixedUsers }}
        runAsUser: 70     # postgres in the alpine image
        runAsGroup: 70
        fsGroup: 70
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      {{- with include "canyonos.podExtras" (list . .Values.dashboard) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.dashboard.dbImage }}
          env:
            - {name: POSTGRES_USER, value: canyonos}
            - {name: POSTGRES_DB, value: canyonos}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: db-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, canyonos, -d, canyonos]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, canyonos, -d, canyonos]}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- include "canyonos.dashboardResources" (list . "db") | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.dashboard.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.dashboard.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: canyonos-dashboard-api
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: canyonos-dashboard-api}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
# Every signed-in user may port-forward to the CanyonOS API, as `canyonos deploy` does;
# the API checks with Kubernetes what each one may do. Port-forward can't be limited to
# one pod, so it reaches every pod here; Postgres still needs its password.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canyonos-dashboard-api-forward
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [canyonos-dashboard-api]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canyonos-dashboard-api-forward
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canyonos-dashboard-api-forward
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canyonos-dashboard-api
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  # One: it migrates its database on start, with no lock between replicas, and holds
  # each deploy's progress in memory.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: canyonos-dashboard-api}
  template:
    metadata:
      labels:
        {{- include "canyonos.podLabels" (list . (dict "app.kubernetes.io/name" "canyonos-dashboard-api" "app.kubernetes.io/part-of" "canyonos")) | trim | nindent 8 }}
      {{- if $apiKeyVersion }}
      annotations:
        canyonos.canyoncode.ai/api-key: {{ $apiKeyVersion }}
      {{- end }}
    spec:
      serviceAccountName: canyonos-api
      # Only the api container gets the service account's token (kube-api-access).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- if .Values.dashboard.fixedUsers }}
        # bun in the api image. The core image has no user of its own, so core runs as
        # bun too, and both may change what the other writes in /workspace.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      {{- with include "canyonos.podExtras" (list . .Values.dashboard) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      initContainers:
        # Runs the canyonos_core.cli commands the API queues in /workspace/.canyonos/jobs
        # (validating and unpacking a workflow, the deploy's plan, the build's upload),
        # with no Kubernetes token and no port. An init container that keeps running (a
        # sidecar): it is up before the API starts, and stops after it.
        - name: core
          image: {{ $coreImage }}
          imagePullPolicy: {{ .Values.dashboard.pullPolicy }}
          restartPolicy: Always
          command: [python, -m, canyonos_core.cli, job-worker, --queue, /workspace/.canyonos/jobs]
          workingDir: /workspace
          env:
            # No home of its own: the image has no such user.
            - {name: HOME, value: /tmp}
          resources:
            {{- include "canyonos.dashboardResources" (list . "core") | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: core-tmp, mountPath: /tmp}
      containers:
        - name: api
          image: {{ $apiImage }}
          imagePullPolicy: {{ .Values.dashboard.pullPolicy }}
          # As `canyonos serve` runs it on Docker, plus the projects the operator lists.
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: db-password}}
            - {name: DATABASE_URL, value: "postgresql://canyonos:$(DB_PASSWORD)@canyonos-dashboard-db:5432/canyonos"}
            # Encrypts a Redis password the API stores; projects the operator lists keep
            # theirs in its list, but the API refuses to start without the key.
            - name: REDIS_PASSWORD_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: redis-password-key}}
            # The dashboard routes' key. Every project's global controller may reach this
            # API (for telemetry), and every signed-in user through a port-forward.
            - name: CANYONOS_API_KEY_HASH
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: api-key-hash, optional: true}}
            - {name: LOG_LEVEL, value: info}
            # Workflow groups run on this cluster, never on Docker.
            - {name: CANYONOS_TARGET, value: kubernetes}
            - {name: DOCKER_SOCKET, value: ""}
            - {name: CANYONOS_PROJECTS_FILE, value: /etc/canyonos/projects/projects.json}
            - {name: METRICS_RAW_RETENTION_DAYS, value: {{ .Values.dashboard.metricsRawRetentionDays | quote }}}
            - {name: METRICS_ROLLUP_RETENTION_DAYS, value: {{ .Values.dashboard.metricsRollupRetentionDays | quote }}}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /readyz, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- include "canyonos.dashboardResources" (list . "api") | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: projects, mountPath: /etc/canyonos/projects, readOnly: true}
            - {name: workspace, mountPath: /workspace}
            - {name: api-tmp, mountPath: /tmp}
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
      volumes:
        # Written by the operator once the first project's Redis is ready.
        - name: projects
          secret: {secretName: canyonos-dashboard-projects, optional: true}
        # Every workflow group's uploaded files, in /workspace/<workflow_group_id>, and
        # the job queue. Lost with the pod: the API then rebuilds its workflow groups from
        # their CanyonProjects, and the next `canyonos deploy` uploads the files again.
        - name: workspace
          emptyDir: {sizeLimit: {{ .Values.dashboard.workspaceSize }}}
        - {name: api-tmp, emptyDir: {}}
        - {name: core-tmp, emptyDir: {}}
        # What Kubernetes mounts into every container when automountServiceAccountToken
        # is on: a token it renews, the cluster's CA and the namespace.
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3607}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {apiVersion: v1, fieldPath: metadata.namespace}
{{- if .Values.dashboard.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: canyonos-dashboard-web
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: canyonos-dashboard-web}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canyonos-dashboard-web
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: canyonos-dashboard-web}
  template:
    metadata:
      labels:
        {{- include "canyonos.podLabels" (list . (dict "app.kubernetes.io/name" "canyonos-dashboard-web" "app.kubernetes.io/part-of" "canyonos")) | trim | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- if .Values.dashboard.fixedUsers }}
        runAsUser: 1000
        runAsGroup: 1000
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      {{- with include "canyonos.podExtras" (list . .Values.dashboard) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: web
          image: {{ $webImage }}
          imagePullPolicy: {{ .Values.dashboard.pullPolicy }}
          env:
            - {name: CANYONOS_API_UPSTREAM, value: "canyonos-dashboard-api:3000"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          resources:
            {{- include "canyonos.dashboardResources" (list . "web") | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The caddy binary carries this file capability and will not start without
            # it; the restricted profile allows exactly this one.
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
{{- end }}
---
# Postgres takes connections from the API only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canyonos-dashboard-db
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: canyonos-dashboard-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: canyonos-dashboard-api}
      ports: [{port: 5432}]
---
# The API takes requests from the web front end, and telemetry from each project's
# global controller, in any namespace. A port-forward, as the CLI opens, is not
# subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canyonos-dashboard-api
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: canyonos-dashboard-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: canyonos-dashboard-web}
        - namespaceSelector: {}
          podSelector:
            matchLabels: {app.kubernetes.io/name: canyonos-gc}
            matchExpressions: [{key: canyonos.canyoncode.ai/project, operator: Exists}]
      ports: [{port: 3000}]
---
# The operator keeps the list of projects in one Secret here and may change nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canyonos-dashboard-registry
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [canyonos-dashboard-projects]
    verbs: [get, update]
  # Create cannot be limited by name; the operator creates only that one.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canyonos-dashboard-registry
  namespace: {{ $ns }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canyonos-dashboard-registry
subjects:
  - kind: ServiceAccount
    name: canyonos-controller-manager
    namespace: {{ .Release.Namespace }}
