apiVersion: apps/v1
kind: Deployment
metadata:
  name: canyonos-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "canyonos.selector" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "canyonos.selector" . | nindent 8 }}
    spec:
      serviceAccountName: canyonos-controller-manager
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "canyonos.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/manager]
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address={{ if .Values.metrics.enabled }}:8443{{ else }}0{{ end }}
            - --controller-image={{ .Values.controllerImage | default (include "canyonos.releaseImage" (list . "core")) }}
            - --canyonos-version={{ .Chart.AppVersion }}
            {{- with .Values.redisImage }}
            - --redis-image={{ . }}
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - --dashboard-namespace={{ .Values.dashboard.namespace }}
            {{- end }}
            {{- if .Values.builder.enabled }}
            - --builder-address=tcp://buildkitd.{{ .Values.builder.namespace }}.svc:1234
            {{- range $pull, $push := .Values.builder.registryAliases }}
            - --registry-alias={{ $pull }}={{ $push }}
            {{- end }}
            {{- end }}
            {{- with .Values.watchNamespaces }}
            - --watch-namespaces={{ join "," . }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - {name: health, containerPort: 8081}
            {{- if .Values.metrics.enabled }}
            - {name: https, containerPort: 8443}
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
