# What the operator may do: the rules `make manifests` generates from its code into
# files/role.yaml.
{{- /* One operator per cluster: it runs projects in any number of namespaces
(watchNamespaces), and the CRDs, the builder, the dashboard and the user roles are the
cluster's. So an install other than the one this role belongs to stops here, saying
so, before Helm applies anything. lookup finds nothing when the chart is rendered
without a cluster (helm template), which is not checked. */}}
{{- with lookup "rbac.authorization.k8s.io/v1" "ClusterRole" "" "canyonos-manager-role" }}
{{- $annotations := .metadata.annotations | default dict }}
{{- $release := index $annotations "meta.helm.sh/release-name" | default "" }}
{{- $namespace := index $annotations "meta.helm.sh/release-namespace" | default "" }}
{{- if not $release }}
{{- fail "CanyonOS's operator is already installed in this cluster, though not by Helm (the ClusterRole canyonos-manager-role exists). One operator serves the whole cluster: run projects through that one, or remove it before installing this chart." }}
{{- else if or (ne $release $.Release.Name) (ne $namespace $.Release.Namespace) }}
{{- fail (printf "CanyonOS's operator is already installed in this cluster: Helm release %q in namespace %q. One operator serves the whole cluster: to run projects in more namespaces, add them to that release's watchNamespaces (empty: every namespace) and upgrade it." $release $namespace) }}
{{- end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyonos-manager-role
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
{{- if .Values.watchNamespaces }}
{{- /* Granted in each watched namespace only: a RoleBinding to a ClusterRole gives its
rules in that namespace and nowhere else. */}}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canyonos-manager-rolebinding
  namespace: {{ . }}
  labels:
    {{- include "canyonos.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: canyonos-manager-role
subjects:
  - kind: ServiceAccount
    name: canyonos-controller-manager
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canyonos-manager-rolebinding
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: canyonos-manager-role
subjects:
  - kind: ServiceAccount
    name: canyonos-controller-manager
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# What the CanyonOS API may do (CANYONOS_TARGET=kubernetes): the calls its Kubernetes
# driver makes for a caller the API has checked with a SubjectAccessReview. Cluster-wide,
# watchNamespaces or not: the API finds every CanyonProject after a restart, and deploys
# into whichever namespace the caller may change.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyonos-api
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
rules:
  # Each workflow group's .env Secrets (server-side apply), and stop's cleanup.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, deletecollection]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [deletecollection]
  # Agent logs, and the build's and the Global Controller's log.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [canyonos.canyoncode.ai]
    resources: [canyonbuilds]
    verbs: [create, get, list, patch, delete]
  # The build pod applies the CanyonProject and its CanyonAgents; the API reads,
  # annotates and deletes them.
  - apiGroups: [canyonos.canyoncode.ai]
    resources: [canyonprojects]
    verbs: [list, patch, delete]
  - apiGroups: [canyonos.canyoncode.ai]
    resources: [canyonagents]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canyonos-api
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: canyonos-api
subjects:
  - kind: ServiceAccount
    name: canyonos-api
    namespace: {{ .Values.dashboard.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canyonos-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canyonos-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "canyonos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canyonos-leader-election-role
subjects:
  - kind: ServiceAccount
    name: canyonos-controller-manager
    namespace: {{ .Release.Namespace }}
{{- if .Values.userRoles.enabled }}
{{- range $kind := list "canyonproject" "canyonagent" "canyonbuild" }}
{{- $resource := printf "%ss" $kind }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyonos-{{ $kind }}-admin
  labels:
    {{- include "canyonos.labels" $ | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [canyonos.canyoncode.ai]
    resources: [{{ $resource }}, {{ $resource }}/scale]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
  - apiGroups: [canyonos.canyoncode.ai]
    resources: [{{ $resource }}/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyonos-{{ $kind }}-edit
  labels:
    {{- include "canyonos.labels" $ | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [canyonos.canyoncode.ai]
    resources: [{{ $resource }}, {{ $resource }}/scale]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [canyonos.canyoncode.ai]
    resources: [{{ $resource }}/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyonos-{{ $kind }}-view
  labels:
    {{- include "canyonos.labels" $ | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [canyonos.canyoncode.ai]
    resources: [{{ $resource }}, {{ $resource }}/status, {{ $resource }}/scale]
    verbs: [get, list, watch]
{{- end }}
{{- end }}
