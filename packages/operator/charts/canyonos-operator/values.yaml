# Where CanyonOS's own images come from: each image left empty below is
# <imageRegistry>/canyonos-<name> at this chart's appVersion, the release it belongs to.
# Point it at a registry mirror that holds them under the same names.
imageRegistry: ghcr.io/canyoncodecoreai

# The operator image. Set digest to pin it (preferred); otherwise tag is used.
image:
  repository: ""   # defaults to <imageRegistry>/canyonos-operator
  tag: ""          # defaults to the chart's appVersion
  digest: ""       # e.g. sha256:...; wins over tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The canyonos-core image every project's global controller and endpoint run; empty:
# this release's. A project may point at its own mirror (spec.controllerImage).
controllerImage: ""

# The image of each project's internal Redis, e.g. from a registry mirror; empty uses
# the operator's default.
redisImage: ""

# Empty: the operator runs projects in any namespace (cluster-wide permissions).
# A list: only in these namespaces, with its permissions granted in them alone.
watchNamespaces: []

replicas: 1        # more than one only adds standbys: leader election picks one

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 256Mi}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Prometheus metrics on :8443 (HTTPS; callers need the canyonos-metrics-reader role).
metrics:
  enabled: true

# The cluster's CanyonOS dashboard, one for every project, in its own namespace. The
# operator lists the projects for it, and its API alone may reach each project's Redis.
# Opened with a port-forward; nothing is exposed outside the cluster.
dashboard:
  enabled: false
  namespace: canyonos-dashboard
  createNamespace: true
  # The canyonos-api and canyonos-web images; empty: this release's.
  apiImage: ""
  webImage: ""
  dbImage: postgres:16-alpine
  pullPolicy: IfNotPresent
  storage: 1Gi
  storageClassName: ""
  # A Secret of your own with db-password and jwt-secret (at least 32 characters);
  # empty: the chart makes one on install. Set it when the chart is rendered without the
  # cluster (helm template, Argo CD), which cannot keep a generated password.
  existingSecret: ""
  # Run its images as their own users (postgres 70, bun and caddy 1000). Turn off on
  # OpenShift, which assigns each namespace its own range of user IDs.
  fixedUsers: true
  # Days the API keeps raw five-second metric ticks (read for ranges of 30 minutes or
  # less) and five-minute rollups (read for longer ranges).
  metricsRawRetentionDays: 3
  metricsRollupRetentionDays: 120

# The in-cluster image builder (BuildKit, rootless) that `canyonos deploy --target
# kubernetes` builds every project's images with. Its namespace gets the one Pod Security
# exception CanyonOS asks for (privileged: seccomp and AppArmor unconfined for BuildKit's
# user namespaces); nothing else runs there.
builder:
  enabled: false
  namespace: canyonos-build
  createNamespace: true
  image: moby/buildkit:v0.25.1-rootless
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 4Gi}
  cacheSize: 20Gi
  nodeSelector: {}
  # Registries the builder may push to over plain HTTP (a local kind registry only).
  insecureRegistries: []
  # A registry the builder reaches by another name than the nodes pull it by:
  # {pull name: push name}, e.g. kind's {"localhost:5001": "kind-registry:5000"}.
  registryAliases: {}

# Aggregated admin/edit/view ClusterRoles for CanyonProject, CanyonAgent and
# CanyonBuild, so whoever administers, edits or views a namespace can do the same with
# its projects: `canyonos deploy` needs no more than a namespace's edit role.
userRoles:
  enabled: true
