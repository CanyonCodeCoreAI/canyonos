services:
  # Fast-path bundled DB, hardcoded creds -- fine for local dev, not for anything real.
  db:
    image: postgres:16-alpine
    # Fixed names: a deployment's containers reach the api and db by them.
    container_name: canyonos-dashboard-db
    environment:
      POSTGRES_USER: canyonos
      POSTGRES_PASSWORD: canyonos
      POSTGRES_DB: canyonos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canyonos"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 500ms

  api:
    image: ${CANYONOS_API_IMAGE}
    container_name: canyonos-dashboard-api
    # Bun as PID 1 ignores SIGTERM, so without an init `docker compose stop` waits 10s to kill it.
    init: true
    # The API runs and stops each workflow group's Global Controller container through
    # the host's Docker engine, whose socket only root may use.
    user: root
    volumes:
      - ${CANYONOS_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      start_period: 30s
      start_interval: 500ms
    depends_on:
      db:
        condition: service_healthy
    # Published on all interfaces (not just 127.0.0.1) so a GC container can
    # actually reach this via host.docker.internal -- Docker's host-gateway
    # route doesn't reach ports bound to loopback only, so a 127.0.0.1 bind
    # here silently black-holed every OTLP span export.
    ports:
      - "${CANYONOS_API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://canyonos:canyonos@db:5432/canyonos
      REDIS_PASSWORD_ENCRYPTION_KEY: ${CANYONOS_REDIS_PASSWORD_ENCRYPTION_KEY}
      # The SHA-256 of this machine's API key (`--api-key`); empty, the API checks
      # nothing. Read once when the API starts.
      CANYONOS_API_KEY_HASH: ${CANYONOS_API_KEY_HASH}
      # The SHA-256 of this machine's control key (`~/.canyonos/control_key`), which
      # the `/v1` routes that run each Global Controller require; unset, they refuse
      # every call.
      CANYONOS_CONTROL_KEY_HASH: ${CANYONOS_CONTROL_KEY_HASH}
      DOCKER_SOCKET: /var/run/docker.sock
      # This container's name, as container_name above: the API connects it to each
      # workflow group's network before it reads that group's Redis by name.
      CANYONOS_API_CONTAINER: canyonos-dashboard-api
      LOG_LEVEL: info
      # Taken from the shell `canyonos deploy` or `canyonos serve` runs in, since the
      # CLI has no setting for how long the API keeps metrics; unset, the API defaults.
      METRICS_RAW_RETENTION_DAYS:
      METRICS_ROLLUP_RETENTION_DAYS:
    extra_hosts:
      - host.docker.internal:host-gateway
  web:
    image: ${CANYONOS_WEB_IMAGE}
    container_name: canyonos-dashboard-web
    healthcheck:
      start_period: 30s
      start_interval: 500ms
    depends_on:
      api:
        condition: service_healthy
    # Published on all interfaces so teammates can open the dashboard on the deploy
    # host's address. Reading or changing a workflow still takes the API key, when
    # one is set.
    ports:
      - "${CANYONOS_WEB_PORT}:8080"
