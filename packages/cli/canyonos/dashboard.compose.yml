services:
  # Fast-path bundled DB, hardcoded creds -- fine for local dev, not for anything real.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canyonos
      POSTGRES_PASSWORD: canyonos
      POSTGRES_DB: canyonos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canyonos"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  api:
    image: ${CANYONOS_API_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    # Published on all interfaces (not just 127.0.0.1) so a GC container can
    # actually reach this via host.docker.internal -- Docker's host-gateway
    # route doesn't reach ports bound to loopback only, so a 127.0.0.1 bind
    # here silently black-holed every OTLP span export. That route also
    # renames canyonos' `project_id` attribute to the `canyon.project.id` every
    # dashboard query filters on.
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://canyonos:canyonos@db:5432/canyonos
      JWT_SECRET: ${CANYONOS_JWT_SECRET}
      LOG_LEVEL: info
      # Taken from the shell `canyonos deploy` or `canyonos serve` runs in, since the
      # CLI has no setting for how long the API keeps metrics; unset, the API defaults.
      METRICS_RAW_RETENTION_DAYS:
      METRICS_ROLLUP_RETENTION_DAYS:
    extra_hosts:
      - host.docker.internal:host-gateway
  web:
    image: ${CANYONOS_WEB_IMAGE}
    depends_on:
      api:
        condition: service_healthy
    # Published on all interfaces so teammates can open the dashboard on the deploy
    # host's address. The API starts with AUTH_MODE=none, so by default anyone who
    # can reach this port reads every project; set AUTH_MODE=password on the api
    # service to require accounts.
    ports:
      - "${CANYONOS_WEB_PORT}:8080"
