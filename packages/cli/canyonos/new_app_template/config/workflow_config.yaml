# Where the project deploys: `docker` is Docker on this machine.
# `canyonos target kubernetes` switches it to a cluster, with the settings a cluster needs.
target: docker

# Where every agent runs: `local` is this machine; `ec2-pool` and `ec2-assign` run
# them on Amazon EC2.
provider: local

# The agents CanyonOS runs for this project.
agents:
  - name: MyAgent
    entrypoint: agents/my_agent.py
    functions:
      - name: run
        arguments:
          - name: query
            type: str
        returns:
          type: str

  - name: Workflow
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

# `POST /main` runs `Workflow.main`, on port 8080 or the next free one.
endpoint:
  agent: Workflow
  method: main
