# The agents CanyonOS runs for this project.
agents:
  - name: MyAgent
    entrypoint: agents/my_agent.py
    functions:
      - name: run
        arguments:
          - name: query
            type: str
        returns:
          type: str

  - name: Workflow
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

# `POST /<this folder's name>/Workflow/main` runs `Workflow.main`, on port 8080 or the
# next free one.
endpoint:
  routes:
    - agent: Workflow
      method: main
