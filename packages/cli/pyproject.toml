[project]
name = "canyonos"
version = "0.1.736"
description = "CanyonOS CLI"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "pyfiglet",
    "python-dotenv",
    "pyyaml",
    "rich",
    "ruamel.yaml",
]

[project.scripts]
canyonos = "cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canyonos*", "utils*"]

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.package-data]
canyonos = ["dashboard.compose.yml"]

[dependency-groups]
dev = [
    "pexpect==4.9.0",
    "pytest>=9.1.1",
]
release = [
    "nuitka==4.2.1",
]
