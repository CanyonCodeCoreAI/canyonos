[project]
name = "canyonos-api-interface"
# The release workflow sets the patch from the commits that changed this folder.
version = "1.0.0"
description = "Typed client for the CanyonOS REST API"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4",
]

[project.urls]
Homepage = "https://canyonos.ai"
Source = "https://github.com/CanyonCodeCoreAI/canyonos"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canyonos_api_interface*"]

[tool.datamodel-codegen]
input = "openapi.json"
input-file-type = "openapi"
output = "canyonos_api_interface/models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.10"
enum-field-as-literal = "all"
use-union-operator = true
disable-timestamp = true
use-schema-description = true
formatters = ["builtin"]
