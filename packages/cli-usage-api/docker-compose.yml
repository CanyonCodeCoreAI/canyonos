# A moto server standing in for Firehose and S3 for `bun run cli:usage:dev`. Its own Compose
# project keeps it apart from the dashboard stack in .docker/docker-compose.yml; it keeps its data
# in memory, and `bun run cli:usage:reset` removes it.
name: canyonos-cli-usage

services:
  moto:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    container_name: canyonos-cli-usage-moto
    ports:
      - '127.0.0.1:8010:5000'
