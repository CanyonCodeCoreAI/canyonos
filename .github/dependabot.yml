version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The images under an `image:` key in the operator chart's values.yaml (BuildKit),
  # tag and digest together.
  - package-ecosystem: docker
    directory: /packages/operator/charts/canyonos-operator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
