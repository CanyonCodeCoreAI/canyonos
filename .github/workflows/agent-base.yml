# Publishes the base every agent image starts from, under the tag stub_generator.py names it by:
# py<python>-<first 12 hex of the Dockerfile's sha256>. A tag already published is left as it is.
name: Agent base image

on:
  pull_request:
    paths:
      - 'packages/core/canyonos_core/agent_base/Dockerfile'
      - '.github/workflows/agent-base.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core/canyonos_core/agent_base/Dockerfile'
      - '.github/workflows/agent-base.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - id: image
        name: Name the image
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          hash=$(sha256sum packages/core/canyonos_core/agent_base/Dockerfile | cut -c1-12)
          echo "ref=ghcr.io/canyoncodecoreai/canyonos-agent-base:py$PYTHON-$hash" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: published
        name: Check whether it is published
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Already published: $IMAGE"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      # The base installs packages inside the target image, so arm64 needs emulation.
      - if: steps.published.outputs.yes != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
        if: steps.published.outputs.yes != 'true'

      - if: steps.published.outputs.yes != 'true'
        uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: packages/core/canyonos_core/agent_base
          platforms: linux/amd64,linux/arm64
          build-args: PYTHON_VERSION=${{ matrix.python }}
          push: true
          tags: ${{ steps.image.outputs.ref }}
