name: SonarQube

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 45

    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan main
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_HOST_URL: https://3.224.186.87
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
