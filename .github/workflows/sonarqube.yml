name: SonarQube

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 45

    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan main
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: https://3.224.186.87
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
