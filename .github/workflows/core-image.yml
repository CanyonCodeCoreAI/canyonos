name: Core image

# Builds the Global Controller image on every change.

on:
  # Paths are duplicated because Actions does not resolve YAML anchors.
  # The pull_request paths must stay the inverse of the pull_request paths in
  # core-image-skip.yml, which reports the required "build" check when this is skipped.
  pull_request:
    paths:
      - 'packages/core/**'
      - '!packages/core/**.md'
      - '.github/workflows/core-image.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - '!packages/core/**.md'
      - '.github/workflows/core-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 builds under emulation; the Dockerfile installs packages in the target image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          # Only main writes the image cache: a PR's entries help only that PR and evict main's from the 10 GB limit.
