name: Core image

# Builds the Global Controller image on every change.

on:
  # Paths are duplicated because Actions does not resolve YAML anchors.
  # The pull_request paths must stay the inverse of the pull_request paths in
  # core-image-skip.yml, which reports the required "build" check when this is skipped.
  pull_request:
    paths:
      - 'packages/core/**'
      - '!packages/core/tests/**'
      - '!packages/core/**.md'
      - '.github/workflows/core-image.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - '!packages/core/tests/**'
      - '!packages/core/**.md'
      - '.github/workflows/core-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 builds under emulation; the Dockerfile installs packages in the target image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=canyonos-core
          # Only main writes the image cache: a PR's entries help only that PR and evict main's from the 10 GB limit.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=canyonos-core' || '' }}
