name: Core image

# Builds the Global Controller image on every change. release.yml publishes it.

on:
  # Paths are duplicated because Actions does not resolve YAML anchors.
  # The pull_request paths must stay the inverse of the pull_request paths in
  # core-image-skip.yml, which reports the required "build" check when this is skipped.
  pull_request:
    paths:
      - 'packages/core/**'
      - '!packages/core/tests/**'
      - '!packages/core/**.md'
      - '.github/workflows/core-image.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - '!packages/core/tests/**'
      - '!packages/core/**.md'
      - '.github/workflows/core-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # arm64 builds under emulation; the Dockerfile installs packages in the target image.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: packages/core
          file: packages/core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=canyonos-core
          cache-to: type=gha,mode=max,scope=canyonos-core
