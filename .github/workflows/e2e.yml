name: E2E

# The README flow (test, deploy, a query on the REST API) against a committed port
# of examples/portfolio, with real agents, real price data and a real Bedrock call.
# `canyonos convert` is not part of it: the port under tests/e2e is verified by hand.

on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/api/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/api/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portfolio:
    # Fork PRs get no secrets, and without the AWS keys the run cannot be real.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true

      - run: uv sync --locked

      # Builds the core image from the Core image cache; the script uses it instead of building its own.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci
          cache-from: type=gha,scope=canyonos-core

      - name: Run the portfolio flow
        env:
          CANYONOS_CORE_IMAGE: canyonos-core:ci
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        run: tests/e2e/run.sh portfolio

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-portfolio
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 7

  governance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true

      - run: uv sync --locked

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci
          cache-from: type=gha,scope=canyonos-core

      - name: Run the governance flow
        env:
          CANYONOS_CORE_IMAGE: canyonos-core:ci
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BEDROCK_SWITCH_MODEL_ID: ${{ vars.BEDROCK_SWITCH_MODEL_ID || 'meta.llama3-8b-instruct-v1:0' }}
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        run: tests/e2e/governance.sh

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-governance
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 7

  multi-project:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true

      - run: uv sync --locked

      # Builds the core and web images from their caches (api builds in seconds); the script uses them instead of building its own.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci
          cache-from: type=gha,scope=canyonos-core
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/web/Dockerfile
          target: canyonos
          build-args: VITE_API_URL=/api
          load: true
          tags: canyonos-web:ci
          cache-from: type=gha,scope=canyonos-web

      - name: Run two projects with the shared dashboard
        env:
          CANYONOS_CORE_IMAGE: canyonos-core:ci
          CANYONOS_WEB_IMAGE: canyonos-web:ci
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        run: tests/e2e/multi_project.sh

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-multi-project
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 7
