name: E2E

# Deploys the workflows under tests/e2e/workflows with the CLI and images from this
# checkout, runs tests/e2e/cases against each one, and runs tests/e2e/scenarios.
# A pull request and a push to main run every workflow not marked release_only.
# Before a release, run it by hand with `release` to add those workflows too.
# The paths are everything the CLI, the three images and the workflows are built from.

on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/api/**'
      - 'packages/web/**'
      - 'packages/ui/**'
      - 'packages/tsconfig/**'
      - 'packages/cli-usage-api/package.json'
      # The CLI calls the API through it, and the dashboard images install its package.json.
      - 'packages/api-interface/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/api/**'
      - 'packages/web/**'
      - 'packages/ui/**'
      - 'packages/tsconfig/**'
      - 'packages/cli-usage-api/package.json'
      # The CLI calls the API through it, and the dashboard images install its package.json.
      - 'packages/api-interface/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      workflows:
        description: "`release` for every workflow, `pr` for the pull request set, or workflow names separated by spaces."
        required: false
        default: release
        type: string

# A new push cancels the run it replaces; a run by hand has a group of its own, so
# a merge to main never cancels a release check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    # Fork and Dependabot PRs get no secrets, and without the model keys the runs
    # cannot be real.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true
      - id: list
        env:
          WORKFLOWS: ${{ inputs.workflows || 'pr' }}
        run: |
          echo "matrix=$(uv run --frozen python tests/e2e/workflows.py $WORKFLOWS)" >> "$GITHUB_OUTPUT"
          echo "scenarios=$(cd tests/e2e/scenarios && basename -s .py test_*.py | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"

  workflow:
    needs: workflows
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        workflow: ${{ fromJson(needs.workflows.outputs.matrix) }}
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true

      - run: uv sync --locked

      # The core and web images come from their caches; the api builds in seconds.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci
          cache-from: type=gha,scope=canyonos-core
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/web/Dockerfile
          target: canyonos
          build-args: VITE_API_URL=/api
          load: true
          tags: canyonos-web:ci
          cache-from: type=gha,scope=canyonos-web

      - name: Run the cases for ${{ matrix.workflow }}
        env:
          CANYONOS_CORE_IMAGE: canyonos-core:ci
          CANYONOS_WEB_IMAGE: canyonos-web:ci
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKFLOW: ${{ matrix.workflow }}
          ARTIFACTS: ${{ runner.temp }}/e2e/${{ matrix.workflow }}
        run: |
          mkdir -p "$ARTIFACTS"
          timeout -s INT 110m uv run --frozen pytest tests/e2e/cases \
            --workflow="$WORKFLOW" --artifacts-dir="$ARTIFACTS" \
            --junitxml="$ARTIFACTS/junit.xml" -o junit_family=xunit2 \
            -p no:cacheprovider -v

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.workflow }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  python:
    name: Agents on Python ${{ matrix.python }}
    # The same rule as `workflows`.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The top entry is the default agents get without a .python-version, which `workflow` runs too:
        # NEWEST_IMAGE_PYTHON_MINOR in packages/core/canyonos_core/stub_generator.py. Bump the two together.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true

      - run: uv sync --locked

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci
          cache-from: type=gha,scope=canyonos-core
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/web/Dockerfile
          target: canyonos
          build-args: VITE_API_URL=/api
          load: true
          tags: canyonos-web:ci
          cache-from: type=gha,scope=canyonos-web

      # context-propagation is staged from examples/helloworld/helloworld, so its .python-version picks the agents' Python.
      - name: Run context-propagation with agents on Python ${{ matrix.python }}
        env:
          CANYONOS_CORE_IMAGE: canyonos-core:ci
          CANYONOS_WEB_IMAGE: canyonos-web:ci
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Also what the workflow's check expects both agents to run on.
          E2E_AGENT_PYTHON: ${{ matrix.python }}
          ARTIFACTS: ${{ runner.temp }}/python-${{ matrix.python }}
        run: |
          echo "$E2E_AGENT_PYTHON" > examples/helloworld/helloworld/.python-version
          mkdir -p "$ARTIFACTS"
          timeout -s INT 35m uv run --frozen pytest tests/e2e/cases \
            --workflow=context-propagation --artifacts-dir="$ARTIFACTS" \
            -p no:cacheprovider -v

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-${{ matrix.python }}
          path: ${{ runner.temp }}/python-${{ matrix.python }}
          retention-days: 14

  scenarios:
    # The same rule as `workflows`. A run by hand with workflow names runs only those
    # workflows; `pr`, `release` or nothing runs the scenarios too.
    needs: workflows
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' || contains(fromJson('["", "pr", "release"]'), inputs.workflows))
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.workflows.outputs.scenarios) }}
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true

      - run: uv sync --locked

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: .
          file: packages/web/Dockerfile
          target: canyonos
          build-args: VITE_API_URL=/api
          load: true
          tags: canyonos-web:ci

      - name: Run ${{ matrix.scenario }}
        env:
          CANYONOS_CORE_IMAGE: canyonos-core:ci
          CANYONOS_WEB_IMAGE: canyonos-web:ci
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BEDROCK_SWITCH_MODEL_ID: ${{ vars.BEDROCK_SWITCH_MODEL_ID || 'meta.llama3-8b-instruct-v1:0' }}
          SCENARIO: ${{ matrix.scenario }}
          ARTIFACTS: ${{ runner.temp }}/e2e/scenarios-${{ matrix.scenario }}
        run: |
          mkdir -p "$ARTIFACTS"
          timeout -s INT 85m uv run --frozen pytest "tests/e2e/scenarios/$SCENARIO.py" \
            --artifacts-dir="$ARTIFACTS" --junitxml="$ARTIFACTS/junit.xml" \
            -o junit_family=xunit2 -p no:cacheprovider -v

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-scenarios-${{ matrix.scenario }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  report:
    # Every workflow the matrix listed, and the scenarios when they ran, must have
    # results: one cut short before uploading any is reported as failed.
    needs: [workflows, workflow, scenarios]
    if: always() && (needs.workflow.result != 'skipped' || needs.scenarios.result != 'skipped')
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-*
          path: artifacts
          merge-multiple: true

      - name: Write report.md
        env:
          TITLE: "E2E: ${{ github.sha }}, run ${{ github.run_number }}"
          WORKFLOWS: ${{ join(fromJson(needs.workflows.outputs.matrix || '[]'), ' ') }}
          SCENARIOS: ${{ needs.scenarios.result != 'skipped' && format('scenarios-{0}', join(fromJson(needs.workflows.outputs.scenarios || '[]'), ' scenarios-')) || '' }}
        run: |
          mkdir -p artifacts
          # shellcheck disable=SC2086
          python3 tests/e2e/report.py artifacts report.md --title "$TITLE" \
            --expect $WORKFLOWS $SCENARIOS
          head -c 1000000 report.md >> "$GITHUB_STEP_SUMMARY"
