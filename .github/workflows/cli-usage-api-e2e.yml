name: CLI Usage API E2E Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/cli-usage-api/**'
      - 'packages/tsconfig/**'
      - '.github/workflows/cli-usage-api-e2e.yml'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - 'packages/cli-usage-api/**'
      - 'packages/tsconfig/**'
      - '.github/workflows/cli-usage-api-e2e.yml'
      - 'package.json'
      - 'bun.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The tests start, stop and remove their own DynamoDB Local container, pinned in
      # packages/cli-usage-api/docker-compose.yml, so they can take it down mid-run.
      - name: Run E2E Tests
        run: bun run cli:usage:test:e2e

      - name: Build the Lambda bundle
        run: bun run --cwd packages/cli-usage-api build
