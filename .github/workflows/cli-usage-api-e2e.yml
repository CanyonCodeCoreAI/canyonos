name: CLI Usage API E2E Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/cli-usage-api/**'
      - 'packages/cli/**'
      - 'packages/tsconfig/**'
      - 'tests/cli_usage/**'
      - '.github/workflows/cli-usage-api-e2e.yml'
      - 'package.json'
      - 'bun.lock'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/cli-usage-api/**'
      - 'packages/cli/**'
      - 'packages/tsconfig/**'
      - 'tests/cli_usage/**'
      - '.github/workflows/cli-usage-api-e2e.yml'
      - 'package.json'
      - 'bun.lock'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  # Adding a label other than `e2e` gets a group of its own, so it cancels nothing.
  group: ${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'e2e') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # A pull request runs this only while it has the `e2e` label.
    if: >-
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'e2e') &&
        (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 15

    steps:
      - uses: useblacksmith/checkout@v1 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The tests start, stop and remove their own moto server container, pinned in
      # packages/cli-usage-api/docker-compose.yml, so they can take it down mid-run.
      - name: Run E2E Tests
        run: bun run cli:usage:test:e2e

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true
          # The default **/uv.lock search walks node_modules for ~40s.
          cache-dependency-glob: uv.lock

      # --locked fails the job when uv.lock is stale.
      - name: Sync the Python workspace
        run: uv sync --locked

      # Runs the real `canyonos` CLI against the real API; tests/cli_usage starts and
      # removes its own moto server container.
      - name: Run CLI feature E2E Tests
        run: bun run cli:usage:test:cli-e2e

      - name: Build the Lambda bundle
        run: bun run --cwd packages/cli-usage-api build
