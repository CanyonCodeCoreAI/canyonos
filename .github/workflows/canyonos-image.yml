name: CanyonOS images

on:
  pull_request:
    # Every input the image build reads, not just the API source. The deps stage installs from the
    # root manifest, the lockfile, and each workspace manifest, and `.dockerignore` decides what the
    # build context even contains, so a change to any of them can change the image.
    paths:
      - 'packages/api/Dockerfile'
      - 'packages/web/Dockerfile'
      - 'packages/web/Caddyfile'
      - '.dockerignore'
      - 'package.json'
      - 'bun.lock'
      - 'packages/web/package.json'
      - 'packages/ui/package.json'
      - 'packages/tsconfig/**'
      - 'packages/api/**'
      - 'packages/web/**'
      - 'packages/ui/**'
      - '.docker/canyonos-smoke.compose.yml'
      - 'scripts/canyonos-smoke.ts'
      - '.github/workflows/canyonos-image.yml'
  # Main pushes warm the build cache that pull requests read.
  push:
    branches: [main]
    paths:
      - 'packages/api/Dockerfile'
      - 'packages/web/Dockerfile'
      - 'packages/web/Caddyfile'
      - '.dockerignore'
      - 'package.json'
      - 'bun.lock'
      - 'packages/web/package.json'
      - 'packages/ui/package.json'
      - 'packages/tsconfig/**'
      - 'packages/api/**'
      - 'packages/web/**'
      - 'packages/ui/**'
      - '.docker/canyonos-smoke.compose.yml'
      - 'scripts/canyonos-smoke.ts'
      - '.github/workflows/canyonos-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/canyoncodecoreai

jobs:
  # Native only. Running the stack through QEMU is too slow to be a useful gate.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compose smoke against the native image
        run: bun run canyonos:smoke

  # Builds both images for both platforms and keeps nothing: this job never pushes.
  build:
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: packages/api/Dockerfile
            target: ''
            build-args: ''
          - name: web
            file: packages/web/Dockerfile
            target: canyonos
            # The dashboard talks to the API through its own origin, so the bundle carries a
            # relative base URL and never a host.
            build-args: |
              VITE_API_URL=/api
              VITE_CANYONOS_LOCAL_MODE=true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Only api needs emulation: packages/api/Dockerfile installs node_modules that get copied into
      # the runtime image, so unlike the web Dockerfile it can't build with $BUILDPLATFORM.
      - if: matrix.name == 'api'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/canyonos-${{ matrix.name }}
          # Custom title/description because metadata-action defaults both images to the same
          # title: the repo name.
          labels: |
            org.opencontainers.image.title=canyonos-${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.name == 'api' && 'CanyonOS API — the Bun/Elysia backend for the CanyonOS dashboard.' || 'CanyonOS dashboard — the self-hosted web UI for CanyonOS.' }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/canyonos-${{ matrix.name }},push=false
          cache-from: type=gha,scope=canyonos-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=canyonos-${{ matrix.name }}
