name: CLI E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      # Every deploy brings up the CanyonOS API, and its image installs these manifests.
      - 'packages/api/**'
      - 'packages/tsconfig/**'
      - 'packages/ui/package.json'
      - 'packages/web/package.json'
      - 'packages/cli-usage-api/package.json'
      - 'packages/sdk/package.json'
      - '.dockerignore'
      - 'bun.lock'
      - 'examples/**'
      - 'scripts/bundle-starters.ts'
      - 'package.json'
      - 'turbo.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/cli-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      # Every deploy brings up the CanyonOS API, and its image installs these manifests.
      - 'packages/api/**'
      - 'packages/tsconfig/**'
      - 'packages/ui/package.json'
      - 'packages/web/package.json'
      - 'packages/cli-usage-api/package.json'
      - 'packages/sdk/package.json'
      - '.dockerignore'
      - 'bun.lock'
      - 'examples/**'
      - 'scripts/bundle-starters.ts'
      - 'package.json'
      - 'turbo.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/cli-e2e.yml'
  workflow_dispatch:

concurrency:
  # Adding a label other than `e2e` gets a group of its own, so it cancels nothing.
  group: ${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'e2e') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # A pull request runs this only while it has the `e2e` label.
    if: >-
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'e2e') &&
        (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: blacksmith-2vcpu-ubuntu-2604
    # The core and API image builds and a dozen real deploys, five of them the API
    # lifecycle cases', on top of the rest of the suite.
    timeout-minutes: 25

    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.15'
          python-version: '3.11.15'
          enable-cache: true

      - run: bun install --frozen-lockfile
      - run: uv sync --locked

      # The bundled Hello World case deploys for real, so the Global Controller
      # needs an image, built from the cache core-image.yml fills on main, and so
      # does the CanyonOS API that every deploy brings up.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: .
          file: packages/api/Dockerfile
          load: true
          tags: canyonos-api:ci

      - name: Run CLI E2E tests
        run: bun run cli:test:e2e
        env:
          PYTEST_ADDOPTS: --basetemp=${{ runner.temp }}/cli-e2e
          # `development` because an image override is refused in production.
          CANYONOS_ENV: development
          CANYONOS_CORE_IMAGE: canyonos-core:ci
          CANYONOS_API_IMAGE: canyonos-api:ci

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-e2e-results
          path: ${{ runner.temp }}/cli-e2e/artifacts
          retention-days: 7
