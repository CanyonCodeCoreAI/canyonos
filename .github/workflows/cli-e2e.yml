name: CLI E2E Tests

on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'examples/**'
      - 'scripts/bundle-starters.ts'
      - 'package.json'
      - 'turbo.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/cli-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'examples/**'
      - 'scripts/bundle-starters.ts'
      - 'package.json'
      - 'turbo.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/cli-e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    # The core image build and a real deploy, on top of the rest of the suite.
    timeout-minutes: 15

    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.15'
          python-version: '3.11.15'
          enable-cache: true

      - run: bun install --frozen-lockfile
      - run: uv sync --locked

      # The bundled Hello World case deploys for real, so the Global Controller
      # needs an image. Built from the cache core-image.yml fills on main.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci

      - name: Run CLI E2E tests
        run: bun run cli:test:e2e
        env:
          PYTEST_ADDOPTS: --basetemp=${{ runner.temp }}/cli-e2e
          # `development` because a core image override is refused in production.
          CANYONOS_ENV: development
          CANYONOS_CORE_IMAGE: canyonos-core:ci

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-e2e-results
          path: ${{ runner.temp }}/cli-e2e/artifacts
          retention-days: 7
