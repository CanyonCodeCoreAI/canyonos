name: API E2E Tests

on:
  push:
    branches: [main, master]
    # The workflow group tests run Global Controllers from the core image.
    paths: ['packages/api/**', 'packages/core/**', '.github/workflows/api-e2e.yml']
  pull_request:
    paths: ['packages/api/**', 'packages/core/**', '.github/workflows/api-e2e.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2604

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canyonos
          POSTGRES_PASSWORD: canyonos
          POSTGRES_DB: canyonos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canyonos -d canyonos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The workflow group tests create Global Controller and job containers on this
      # runner's Docker from the core image. Built from the cache core-image.yml fills on main.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci

      # No env file: src/test/setup.ts points the suite at this job's services. Bun 1.3.14 can
      # crash partway through the suite, so a failed run gets one more attempt.
      - name: Run E2E Tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          command: cd packages/api && bun run test:e2e
        env:
          CANYONOS_CORE_IMAGE: canyonos-core:ci

      - name: Run migration tests on a populated database
        run: cd packages/api && bun run test:migration

      # The script points DATABASE_URL at a port nothing answers on.
      - name: Run API tests with the database down
        run: cd packages/api && bun run test:no-database

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-e2e-results
          path: packages/api/test-results/
          retention-days: 7
