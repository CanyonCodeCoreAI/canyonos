name: API E2E Tests

on:
  push:
    branches: [main, master]
    # The workflow group tests run Global Controllers from the core image.
    paths: ['packages/api/**', 'packages/core/**', '.github/workflows/api-e2e.yml']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['packages/api/**', 'packages/core/**', '.github/workflows/api-e2e.yml']

concurrency:
  # Adding a label other than `e2e` gets a group of its own, so it cancels nothing.
  group: ${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'e2e') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # A pull request runs this only while it has the `e2e` label.
    if: >-
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'e2e') &&
        (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canyonos
          POSTGRES_PASSWORD: canyonos
          POSTGRES_DB: canyonos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canyonos -d canyonos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The workflow group tests create Global Controller and job containers on this
      # runner's Docker from the core image. Built from the cache core-image.yml fills on main.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:ci
          cache-from: type=gha,scope=canyonos-core

      # No env file: src/test/setup.ts points the suite at this job's services. Bun 1.3.14 can
      # crash partway through the suite, so a failed run gets one more attempt.
      - name: Run E2E Tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          command: cd packages/api && bun run test:e2e
        env:
          CANYONOS_CORE_IMAGE: canyonos-core:ci

      - name: Run migration tests on a populated database
        run: cd packages/api && bun run test:migration

      # The script points DATABASE_URL at a port nothing answers on.
      - name: Run API tests with the database down
        run: cd packages/api && bun run test:no-database

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-e2e-results
          path: packages/api/test-results/
          retention-days: 7
