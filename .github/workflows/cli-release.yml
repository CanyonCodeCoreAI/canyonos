name: Release CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. cli-v0.1.731)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Other prefixes belong to other release workflows, so a non "cli-v" tag skips
  # this job and every job behind it.
  verify:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Check the tag against the manifest
        id: tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tagged="${TAG#cli-v}"
          manifest=$(grep -m1 '^version = ' packages/cli/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$tagged" != "$manifest" ]; then
            echo "$TAG does not match packages/cli/pyproject.toml version $manifest" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: canyonos-macos-arm64
          - os: macos-15-intel
            asset: canyonos-macos-x86_64
          - os: ubuntu-latest
            asset: canyonos-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: canyonos-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Turborepo
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          enable-cache: true

      # nuitka is in the non-default "release" group, so a plain uv sync skips it.
      - name: Install the CLI and Nuitka
        run: uv sync --locked --package canyonos --group release

      # The task runs from packages/cli; arguments after "--" append to its command.
      - name: Build standalone binary
        run: bun run build:binary --filter=canyonos -- --output-filename=${{ matrix.asset }}

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: packages/cli/dist/${{ matrix.asset }}

  # PyPI last: a version can never be re-uploaded, and the binaries can.
  publish-pypi:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Turborepo
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Build sdist and wheel
        run: bun run build --filter=canyonos

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ 'dist/canyonos-*'

  # main is protected, so the formula bump lands as a PR rather than a direct push.
  update-brew-formula:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Download release binaries
        run: gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir bin --pattern 'canyonos-*'

      - name: Update version and sha256 in Formula/canyonos.rb
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_TAG"].removeprefix("cli-v")
          formula = pathlib.Path("Formula/canyonos.rb")
          text = re.sub(r'version ".*"', f'version "{version}"', formula.read_text(), count=1)
          for asset in ("canyonos-macos-arm64", "canyonos-macos-x86_64", "canyonos-linux-arm64", "canyonos-linux-x86_64"):
              sha256 = hashlib.sha256(pathlib.Path(f"bin/{asset}").read_bytes()).hexdigest()
              text, count = re.subn(
                  rf'(url "[^"]*/{re.escape(asset)}"\n\s*sha256 ")[a-f0-9]+(")',
                  rf"\g<1>{sha256}\g<2>",
                  text,
              )
              if count != 1:
                  raise SystemExit(f"{asset} not found in {formula}")
          formula.write_text(text)
          PY

      - name: Open formula PR
        run: |
          if git diff --quiet Formula/canyonos.rb; then
            echo "Formula already at $RELEASE_TAG"
            exit 0
          fi
          branch="brew/$RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "brew: update canyonos formula to $RELEASE_TAG"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update homebrew formula to $RELEASE_TAG" \
            --body "Bumps Formula/canyonos.rb version and sha256s to the $RELEASE_TAG release binaries."

# Triggered by publishing a GitHub release on a "cli-v*" tag, or by workflow_dispatch with
# that tag to rebuild and re-attach the binaries. No workflow creates tags or bumps versions.
# packages/cli/install.sh downloads the matching asset for the latest "cli-v*" release.
