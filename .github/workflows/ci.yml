name: CI

on:
  # No branch filter, so a PR against another PR's branch runs too.
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Cache turbo task results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Turborepo
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true
          # The default **/uv.lock search walks node_modules for ~40s.
          cache-dependency-glob: uv.lock

      # --locked fails the job when uv.lock is stale.
      - name: Sync the Python workspace
        run: uv sync --locked

      - name: Run lint, type check, and format check
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Check that every manifest carries the same version
        run: bun run version:check

      - name: Run the repository script tests
        run: bun test scripts

  # The CLI runs on people's own machines, so its tests also run on macOS and Windows
  # (the test job above runs them on Linux). Core and the other packages are Linux-only.
  cli:
    name: CLI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Just the CLI: the released CLI has none of core in it.
      - name: Sync the CLI
        run: uv sync --locked --package canyonos

      - name: Check that the CLI starts
        run: uv run --frozen --package canyonos canyonos --help

      - name: Run the CLI tests
        working-directory: packages/cli
        run: uv run --frozen --package canyonos pytest tests --ignore=tests/e2e

# If you want to run this locally, install act and run "act pull_request"
# For the same checks without act: bun run check && bun run test
# For reporting Ruff lint errors: bun run lint
# For fixing Ruff formatting errors: bun run format
