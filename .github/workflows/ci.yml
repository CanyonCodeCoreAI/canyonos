name: CI

on:
  # No branch filter, so a PR against another PR's branch runs too.
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1

      - name: Cache turbo task results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Turborepo
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true
          # The default **/uv.lock search walks node_modules for ~40s.
          cache-dependency-glob: uv.lock

      # --locked fails the job when uv.lock is stale.
      - name: Sync the Python workspace
        run: uv sync --locked

      - name: Run lint, type check, format check, and the port rules check
        run: bun run check

      - name: Check that every manifest carries the same version
        run: bun run version:check

      # Untracked files count too: a new generated file must be committed.
      - name: Check that the API spec and the SDKs match the API (bun run sdk:generate)
        run: |
          bun run sdk:generate
          git add --intent-to-add -- packages/api/openapi.json packages/sdk packages/cli/canyonos/sdk
          git diff --exit-code -- packages/api/openapi.json packages/sdk packages/cli/canyonos/sdk

  # The CLI runs on people's own machines, so its startup and bundled workflows are
  # checked on macOS and Windows. Core and the other packages are Linux-only.
  cli:
    name: CLI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-6vcpu-macos-15, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Just the CLI: the released CLI has none of core in it.
      - name: Sync the CLI
        run: uv sync --locked --package canyonos

      - name: Check that the CLI starts
        run: uv run --frozen --package canyonos canyonos --help

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The bundled workflows are generated, not committed, and this job does not
      # go through turbo. The script needs no dependencies, so there is no install.
      - name: Bundle the workflows
        run: bun run scripts/bundle-starters.ts

# If you want to run this locally, install act and run "act pull_request"
# For the same checks without act: bun run check
# For reporting Ruff lint errors: bun run lint
# For fixing Ruff formatting errors: bun run format
