# CanyonOS on Kubernetes end to end: a kind cluster as scripts/kind/up.sh makes it,
# then scripts/kind/chart-e2e.sh (the chart installed, upgraded from the last release,
# rolled back, uninstalled and installed again, with a project on it throughout), then
# scripts/kind/e2e.sh (the chart with the builder, the CanyonOS API and the
# dashboard, a deploy with the real CLI through that API by a user who may only edit
# one namespace, requests, the dashboard, a Redis password rotation, stop and clean).
# It takes about thirty-five minutes on a GitHub runner. It runs for the same packages
# as the Docker E2E (e2e.yml), since a change anywhere in them can break the deploy,
# plus the operator and the kind scripts: on each pull request and on main.

name: Kubernetes E2E

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/api/**"
      - "packages/operator/**"
      - "scripts/kind/**"
      - ".github/workflows/kubernetes-e2e.yml"
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/api/**"
      - "packages/operator/**"
      - "scripts/kind/**"
      - ".github/workflows/kubernetes-e2e.yml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


env:
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d


jobs:
  e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1 # v4

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c
          sudo install kind /usr/local/bin/kind

      # A kind cluster and four image builds (the web image's Caddy stage alone pulls a
      # large Go module tree) can fill the runner's disk; drop toolchains this job never
      # uses.
      # Both run in the background while the images build; the Cluster step waits for them.
      - name: Start freeing disk space and the cluster
        # e2e.sh installs CanyonOS itself, under its own image tag.
        run: |
          (
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
            rc=0
            scripts/kind/up.sh --verify --no-operator || rc=$?
            wait || true
            echo "${rc}" > "${RUNNER_TEMP}/cluster.rc"
          ) > "${RUNNER_TEMP}/cluster.log" 2>&1 &

      # e2e.sh builds the images with `bun run canyonos:dev --images-only`, as a laptop does.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Fills this builder from main's image caches, so e2e.sh's own builds take seconds.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: packages/core
          file: packages/core/Dockerfile
          load: true
          tags: canyonos-core:dev
      # The CanyonOS API: every deploy runs through it.
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: .
          file: packages/api/Dockerfile
          load: true
          tags: canyonos-api:dev
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: .
          file: packages/web/Dockerfile
          target: canyonos
          build-args: VITE_API_URL=/api
          load: true
          tags: canyonos-web:dev
      - uses: useblacksmith/build-push-action@v2 # v7.4.0
        with:
          context: packages/operator
          file: packages/operator/Dockerfile
          load: true
          tags: canyonos-operator:dev

      - name: Cluster
        run: |
          until [ -f "${RUNNER_TEMP}/cluster.rc" ]; do sleep 2; done
          cat "${RUNNER_TEMP}/cluster.log"
          df -h /
          exit "$(cat "${RUNNER_TEMP}/cluster.rc")"

      # Before the end to end, which then runs on the CanyonOS it leaves installed.
      - name: Chart install, upgrade and uninstall
        run: scripts/kind/chart-e2e.sh

      - name: End to end
        run: scripts/kind/e2e.sh

      - name: Cluster state on failure
        if: failure()
        # Each line on its own: the run may have failed before the CRDs or the operator
        # were installed.
        run: |
          df -h / || true
          kubectl get pods -A -o wide || true
          kubectl get canyonprojects,canyonagents,canyonbuilds -A -o wide || true
          kubectl -n canyonos-system logs deploy/canyonos-controller-manager --tail=200 || true
          kubectl -n canyonos-dashboard logs deploy/canyonos-dashboard-api -c api --tail=200 || true
          kubectl -n canyonos-dashboard logs deploy/canyonos-dashboard-api -c core --tail=200 || true
          kubectl -n canyonos-e2e describe pods -l canyonos.canyoncode.ai/build || true
          kubectl -n canyonos-e2e logs -l canyonos.canyoncode.ai/build --all-containers --prefix --tail=100 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
