# CanyonOS on Kubernetes end to end: a kind cluster as scripts/kind/up.sh makes it,
# then scripts/kind/e2e.sh (the chart with the builder and the dashboard, a deploy
# with the real CLI by a user who may only edit one namespace, requests, the
# dashboard, a Redis password rotation, stop and clean). Run for changes that can
# break that path; it takes about twenty-five minutes on a GitHub runner.

name: Kubernetes E2E

on:
  pull_request:
    paths:
      - "packages/operator/**"
      - "packages/cli/canyonos/kubernetes_target.py"
      - "packages/cli/cli.py"
      - "packages/core/canyonos_core/kubernetes/**"
      - "packages/core/canyonos_core/cli.py"
      - "packages/core/canyonos_core/controller/**"
      - "packages/core/canyonos_core/schema/kubernetes_block.py"
      - "packages/core/Dockerfile"
      - "packages/api/src/modules/canyonos/**"
      - "scripts/kind/**"
      - ".github/workflows/kubernetes-e2e.yml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


env:
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d


jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c
          sudo install kind /usr/local/bin/kind

      # A kind cluster and four image builds (the web image's Caddy stage alone pulls a
      # large Go module tree) can fill the runner's disk; drop toolchains this job never
      # uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cluster
        # e2e.sh installs CanyonOS itself, under its own image tag.
        run: scripts/kind/up.sh --verify --no-operator

      # e2e.sh builds the images with `bun run canyonos:dev --images-only`, as a laptop does.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: End to end
        run: scripts/kind/e2e.sh

      - name: Cluster state on failure
        if: failure()
        # Each line on its own: the run may have failed before the CRDs or the operator
        # were installed.
        run: |
          df -h / || true
          kubectl get pods -A -o wide || true
          kubectl get canyonprojects,canyonagents,canyonbuilds -A -o wide || true
          kubectl -n canyonos-system logs deploy/canyonos-controller-manager --tail=200 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
