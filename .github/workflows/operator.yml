name: Operator

on:
  pull_request:
    paths:
      - "packages/operator/**"
      - ".github/workflows/operator.yml"
  push:
    branches: [ main ]
    paths:
      - "packages/operator/**"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Go toolchain the operator is developed with, as on a laptop.
    container: golang:1.27.0
    defaults:
      run:
        working-directory: packages/operator

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate, vet, test (envtest) and lint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make manifests generate fmt vet test lint

      # CRDs, RBAC and deep-copy code come from the Go types and markers (the test step
      # above regenerated them). Fail when a change forgot to commit them.
      - name: Generated files are committed
        run: git diff --exit-code -- .

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # helm 3.17.3, pinned by digest.
    container: alpine/helm@sha256:d899e6316789fec04ee95300a18e454b7942539cbb3d89bde3e0655d6ca2e895
    defaults:
      run:
        working-directory: packages/operator/charts

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Both install modes must render: cluster-wide (with the builder and the
      # dashboard) and limited to some namespaces.
      - name: Lint and render the chart
        run: |
          helm lint canyonos-operator --set controllerImage=canyonos-core@sha256:0
          helm template t canyonos-operator --set controllerImage=canyonos-core@sha256:0 \
            --set builder.enabled=true --set dashboard.enabled=true \
            --set dashboard.apiImage=canyonos-api@sha256:0 --set dashboard.webImage=canyonos-web@sha256:0 \
            > /dev/null
          helm template t canyonos-operator --set controllerImage=canyonos-core@sha256:0 \
            --set "watchNamespaces={team-a,team-b}" > /dev/null
          # A release's chart installs with no image set: its own release's images.
          helm template t canyonos-operator --set builder.enabled=true \
            --set dashboard.enabled=true > /dev/null

  # The operator image for both platforms, as the release builds it, so a Dockerfile
  # that no longer builds fails here and not in a release. Pushes nothing.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No emulation: the Dockerfile cross-compiles on the runner's own platform.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/operator
          file: packages/operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=canyonos-operator
          # Only main writes the image cache, as for the other images.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=canyonos-operator' || '' }}
