name: Operator

on:
  pull_request:
    paths:
      - "packages/operator/**"
      - ".github/workflows/operator.yml"
  push:
    branches: [ main ]
    paths:
      - "packages/operator/**"
      - ".github/workflows/operator.yml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Go toolchain the operator is developed with, as on a laptop.
    container: golang:1.27.0
    defaults:
      run:
        working-directory: packages/operator

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Go modules, build cache, lint cache, and the tools and envtest binaries in bin/.
      - id: go-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /go/pkg/mod
            ~/.cache
            packages/operator/bin
          key: operator-go-${{ hashFiles('packages/operator/go.sum', 'packages/operator/Makefile') }}
          restore-keys: operator-go-

      - name: Generate, vet, test (envtest) and lint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make manifests generate fmt vet test lint

      # CRDs, RBAC and deep-copy code come from the Go types and markers (the test step
      # above regenerated them). Fail when a change forgot to commit them.
      - name: Generated files are committed
        run: git diff --exit-code -- .

      # Only main writes the cache, as for the images.
      - if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /go/pkg/mod
            ~/.cache
            packages/operator/bin
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # helm 3.17.3, pinned by digest.
    container: alpine/helm@sha256:d899e6316789fec04ee95300a18e454b7942539cbb3d89bde3e0655d6ca2e895
    defaults:
      run:
        working-directory: packages/operator/charts

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Both install modes must render: cluster-wide (with the builder and the
      # dashboard, the defaults) and limited to some namespaces; and with the builder
      # and the dashboard turned off. None takes an API key: each workflow group's
      # dashboard routes take its own, from its CanyonProject.
      - name: Lint and render the chart
        run: |
          helm lint canyonos-operator --set controllerImage=canyonos-core@sha256:0
          helm template t canyonos-operator --set controllerImage=canyonos-core@sha256:0 \
            --set dashboard.apiImage=canyonos-api@sha256:0 --set dashboard.webImage=canyonos-web@sha256:0 \
            > /dev/null
          helm template t canyonos-operator --set controllerImage=canyonos-core@sha256:0 \
            --set "watchNamespaces={team-a,team-b}" > /dev/null
          helm template t canyonos-operator --set dashboard.existingSecret=mine > /dev/null
          helm template t canyonos-operator --set builder.enabled=false \
            --set dashboard.enabled=false > /dev/null
          # A release's chart installs with no image set: its own release's images, and
          # the builder and the dashboard's web app.
          helm template t canyonos-operator > /tmp/defaults.yaml
          grep -q '^  name: buildkitd$' /tmp/defaults.yaml || { echo "no builder by default"; exit 1; }
          grep -q '^  name: canyonos-dashboard-web$' /tmp/defaults.yaml || { echo "no dashboard by default"; exit 1; }
          # No chart-wide key: neither the Secret nor the API's environment holds one.
          if grep -q -e 'api-key-hash' -e 'CANYONOS_API_KEY_HASH' /tmp/defaults.yaml; then
            echo "the chart still renders a chart-wide API key"; exit 1
          fi
          # Every CRD is rendered, and kept by Helm (never deleted, not even on
          # uninstall); with crds.enabled=false, none is.
          crds="$(ls canyonos-operator/files/crds/*.yaml | wc -l)"
          helm template t canyonos-operator --show-only templates/crds.yaml > /tmp/crds.yaml
          [ "$(grep -c '^kind: CustomResourceDefinition$' /tmp/crds.yaml)" = "${crds}" ]
          [ "$(grep -c '^    helm.sh/resource-policy: keep$' /tmp/crds.yaml)" = "${crds}" ]
          helm template t canyonos-operator --set crds.enabled=false > /tmp/no-crds.yaml
          if grep -q 'kind: CustomResourceDefinition' /tmp/no-crds.yaml; then exit 1; fi

      # Each pod setting reaches the pods it is for (the operator, the builder, and the
      # dashboard's db, api and web), and podLabels never replace the chart's own labels.
      - name: Pod settings reach their pods
        run: |
          helm template t canyonos-operator --set builder.enabled=true --set dashboard.enabled=true \
            --set dashboard.existingSecret=mine \
            --set "imagePullSecrets[0].name=main-login" \
            --set "builder.imagePullSecrets[0].name=build-login" \
            --set "dashboard.imagePullSecrets[0].name=dash-login" \
            --set priorityClassName=canyonos-low \
            --set podLabels.team=platform --set "podLabels.app\.kubernetes\.io/name=taken" \
            --set "tolerations[0].key=operator-only" --set "tolerations[0].operator=Exists" \
            --set "builder.tolerations[0].key=build-only" --set "builder.tolerations[0].operator=Exists" \
            --set "dashboard.tolerations[0].key=dash-only" --set "dashboard.tolerations[0].operator=Exists" \
            --set dashboard.nodeSelector.pool=system --set builder.nodeSelector.pool=build \
            --set dashboard.resources.db.limits.memory=2Gi \
            --set dashboard.resources.core.limits.memory=3Gi > /tmp/set.yaml
          expect() {  # expect <count> <text>: the text is in the render that many times
            got="$(grep -cF -- "$2" /tmp/set.yaml || true)"
            [ "${got}" = "$1" ] || { echo "expected $1 x '$2', found ${got}"; exit 1; }
          }
          expect 1 "name: main-login"
          expect 1 "name: build-login"
          expect 3 "name: dash-login"
          expect 5 "priorityClassName: canyonos-low"
          expect 5 'team: "platform"'
          expect 0 '"taken"'
          expect 1 "key: operator-only"
          expect 1 "key: build-only"
          expect 3 "key: dash-only"
          expect 1 "pool: build"
          expect 3 "pool: system"
          expect 1 "memory: 2Gi"
          expect 1 "memory: 3Gi"

      # An upgrade with --reuse-values from a release before dashboard.resources keeps
      # that release's values, which have none: the templates' own sizes are then used,
      # and must be the ones values.yaml gives.
      - name: Dashboard sizes without dashboard.resources
        run: |
          helm template t canyonos-operator --set dashboard.existingSecret=mine \
            --set dashboard.enabled=true > /tmp/sizes.yaml
          helm template t canyonos-operator --set dashboard.existingSecret=mine \
            --set dashboard.enabled=true --set dashboard.resources=null > /tmp/no-sizes.yaml
          diff /tmp/sizes.yaml /tmp/no-sizes.yaml

      # On OpenShift (its security API, or `openshift` set where the chart is rendered
      # without the cluster), pods run as the user IDs it assigns unless fixedUsers says
      # otherwise, and BuildKit runs under its nested-container SCC.
      - name: OpenShift
        run: |
          render() {  # render <helm template args>: the chart with the builder and dashboard on
            helm template t canyonos-operator --set dashboard.existingSecret=mine \
              --set builder.enabled=true --set dashboard.enabled=true "$@"
          }
          render --api-versions security.openshift.io/v1 > /tmp/openshift.yaml
          grep -q -- '--fixed-users=false' /tmp/openshift.yaml
          if render --api-versions security.openshift.io/v1 --show-only templates/dashboard.yaml \
            | grep -q runAsUser; then
            echo "a dashboard pod asks for a fixed user on OpenShift"; exit 1
          fi
          grep -q 'name: system:openshift:scc:nested-container' /tmp/openshift.yaml
          grep -q 'hostUsers: false' /tmp/openshift.yaml
          render --api-versions security.openshift.io/v1 --set fixedUsers=true | grep -q -- '--fixed-users=true'
          render --set openshift=true | grep -q -- '--fixed-users=false'
          render | grep -q -- '--fixed-users=true'
          # Elsewhere BuildKit gets none of it: hostUsers: false or OpenShift's ConfigMaps
          # would keep its pod from starting.
          if render --show-only templates/builder.yaml \
            | grep -v '^ *#' | grep -qE 'hostUsers|required-scc|nested-container|openshift-service-ca|subids'; then
            echo "BuildKit gets OpenShift settings off OpenShift"; exit 1
          fi
          # One registry table each, also when the built-in registry is listed as insecure.
          render --set openshift=true \
            --set "builder.insecureRegistries={image-registry.openshift-image-registry.svc:5000}" \
            --show-only templates/builder.yaml > /tmp/insecure.yaml
          [ "$(grep -c '\[registry\.' /tmp/insecure.yaml)" = 1 ]
          # A string in any case counts; anything but true or false fails, naming it.
          render --set-string fixedUsers=False | grep -q -- '--fixed-users=false'
          if render --set-string openshift=yes > /tmp/yes.txt 2>&1; then
            echo "openshift=yes was taken"; exit 1
          fi
          grep -q 'openshift must be true or false' /tmp/yes.txt || { cat /tmp/yes.txt; exit 1; }
          # Earlier releases' dashboard.fixedUsers: false still counts; its default true
          # (kept by --reuse-values) changes nothing.
          render --set dashboard.fixedUsers=false | grep -q -- '--fixed-users=false'
          render --api-versions security.openshift.io/v1 --set dashboard.fixedUsers=true \
            | grep -q -- '--fixed-users=false'
          render --set dashboard.fixedUsers=false --set fixedUsers=true | grep -q -- '--fixed-users=true'

  # The operator image for both platforms, as the release builds it, so a Dockerfile
  # that no longer builds fails here and not in a release. Pushes nothing.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No emulation: the Dockerfile cross-compiles on the runner's own platform.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/operator
          file: packages/operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=canyonos-operator
          # Only main writes the image cache, as for the other images.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=canyonos-operator' || '' }}
