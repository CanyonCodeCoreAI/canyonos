name: Release notes

# Writes the body of every published release.
# - Package releases (cli-v, core-v, api-v, web-v): a technical changelog of the pull requests
#   that changed that package since its previous release.
# - Dated releases (v2026.09.25): human notes from Linear, with a section for each package
#   whose version changed since the previous dated release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_tag:
        description: Published release tag (e.g. v2026.09.25 or cli-v0.1.731).
        required: true
        type: string
      previous_tag:
        description: Tag or commit to compare against, when there is no earlier release of the same kind.
        required: false
        type: string
      publish:
        description: Update the GitHub release after successful generation.
        required: false
        default: false
        type: boolean

concurrency:
  group: release-notes-${{ github.event.release.tag_name || inputs.target_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      TARGET_TAG: ${{ github.event.release.tag_name || inputs.target_tag }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.target_tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Generate release notes
        run: |
          mkdir -p "$RELEASE_NOTES_OUTPUT_DIR"
          bun run scripts/release-notes.ts "$TARGET_TAG" "$PREVIOUS_TAG"
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_NOTES_OUTPUT_DIR: ${{ runner.temp }}/release-notes
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload release-note audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/release-notes/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: generate
    if: >-
      needs.generate.result == 'success' &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TARGET_TAG: ${{ github.event.release.tag_name || inputs.target_tag }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes-${{ github.run_id }}
          path: release-notes

      - name: Update GitHub release notes
        run: gh release edit "$TARGET_TAG" --notes-file release-notes/release-notes.md
