name: UI E2E Tests

on:
  push:
    branches: [main, master]
    paths:
      ['packages/web/**', 'packages/ui/**', 'packages/api/**', '.github/workflows/ui-e2e.yml']
  pull_request:
    paths:
      ['packages/web/**', 'packages/ui/**', 'packages/api/**', '.github/workflows/ui-e2e.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: postgres://cc_forge:cc_forge@localhost:5432/cc_forge
      JWT_SECRET: test-jwt-secret-not-for-production
      AUTH_EMAIL_FROM: noreply@cc-forge.test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cc_forge
          POSTGRES_PASSWORD: cc_forge
          POSTGRES_DB: cc_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cc_forge -d cc_forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The specs import the API SDK from its dist, which nothing else in this job builds.
      - name: Build the API SDK
        run: bun run build:sdk

      - name: Install Playwright browsers
        working-directory: packages/web
        run: bunx playwright install --with-deps chromium

      - run: bun ui:test:e2e

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
