name: Release web image

# Publishes ghcr.io/canyoncodecoreai/canyonos-web when a "web-v*" GitHub release is
# published. canyonos-image.yml keeps building the image on pull requests and main.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. web-v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: canyonos-web

jobs:
  # Other prefixes belong to other release workflows, so a non "web-v" tag skips
  # this job and every job behind it.
  verify:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'web-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - id: tag
        name: Check the tag against the manifest
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tagged="${TAG#web-v}"
          manifest=$(jq -r '.version' packages/web/package.json)
          if [ "$tagged" != "$manifest" ]; then
            echo "$TAG does not match packages/web/package.json version $manifest" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$tagged" >> "$GITHUB_OUTPUT"

  # The same Compose smoke canyonos-image.yml runs: it builds both images natively and
  # drives the stack. The web image is only proven next to the api one, so the api
  # release runs this too.
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compose smoke against the native images
        run: bun run canyonos:smoke

  # The only job that pushes. A published "web-v*" release is the switch.
  publish:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      # ghcr requires a lowercase namespace; the org login is mixed case.
      - id: registry
        name: Resolve the registry namespace
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "path=ghcr.io/$owner" >> "$GITHUB_OUTPUT"

      # No QEMU: packages/web/Dockerfile builds the bundle under $BUILDPLATFORM.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.registry.outputs.path }}/${{ env.IMAGE_NAME }}
          # The version comes from the verified tag, not from github.ref, because the
          # image tag carries no "web-v" prefix. No `latest`: the CLI pins an exact
          # version through WEB_VERSION.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
          # Custom title/description because metadata-action defaults to the repo name.
          labels: |
            org.opencontainers.image.title=canyonos-web
            org.opencontainers.image.description=CanyonOS dashboard — the self-hosted web UI for CanyonOS.

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/web/Dockerfile
          target: canyonos
          platforms: linux/amd64,linux/arm64
          # The dashboard talks to the API through its own origin, so the bundle carries
          # a relative base URL and never a host.
          build-args: |
            VITE_API_URL=/api
            VITE_CANYONOS_LOCAL_MODE=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=canyonos-web
          cache-to: type=gha,mode=max,scope=canyonos-web
