version = 1

[[annotations]]
path = "packages/api/src/modules/telemetry/proto/opentelemetry/**"
precedence = "override"
SPDX-FileCopyrightText = "The OpenTelemetry Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "packages/cli/canyonos/new_app_template/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Canyon Code, Inc."
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  "**/*.lock",
  "**/*.svg",
  "**/*.png",
  "**/*.jpg",
  "**/*.gif",
  "**/*.db",
  "**/*.rb",
  "**/*.txt",
  "tests/e2e/projects/portfolio/.canyon/**",
  "packages/api/src/db/migrations/**",
  # Recorded telemetry, gzipped: no room for a header.
  "packages/api/src/db/*.fixture.json.gz",
  "packages/web/src/routeTree.gen.ts",
  # Generated from openapi.json, and the empty marker that says the package is typed.
  "packages/api-interface/src/schema.ts",
  "packages/api-interface/canyonos_api_interface/models.py",
  "packages/api-interface/canyonos_api_interface/py.typed",
  # Kubernetes YAML that controller-gen regenerates, and Go module files.
  "packages/operator/charts/*/crds/**",
  "packages/operator/charts/*/files/**",
  "packages/operator/PROJECT",
  "packages/operator/go.mod",
  "packages/operator/go.sum",
  "LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Canyon Code, Inc."
SPDX-License-Identifier = "AGPL-3.0-only"
