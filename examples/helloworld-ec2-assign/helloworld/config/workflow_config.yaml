# The agents CanyonOS runs.
agents:
  - name: HelloAgent
    resources:
      cpu: 1
      memory: 512
    entrypoint: agents/hello_agent.py
    functions:
      - name: hello
        arguments:
          - name: name
            type: str
        returns:
          type: str

  - name: Workflow
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

endpoint:
  routes:
    - agent: Workflow
      method: main
