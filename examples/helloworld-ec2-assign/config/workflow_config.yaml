# Where the project deploys: `docker` is Docker on this machine, which starts the
# EC2 machines below.
target: docker

# Where every replica runs: here, an EC2 machine of its own per replica, of the type
# `ec2-assign: machine_type:` gives its agent. See docs/guides/EC2.md.
provider: ec2-assign

ec2-assign:
  machine_type:
    HelloAgent: t3.micro
    Workflow: t3.micro

# The agents CanyonOS runs.
agents:
  - name: HelloAgent
    resources:
      cpu: 1
      memory: 512
    entrypoint: agents/hello_agent.py
    functions:
      - name: hello
        arguments:
          - name: name
            type: str
        returns:
          type: str

  - name: Workflow
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

endpoint:
  agent: Workflow
  method: main

# Stream failure/log detail into each future's `logs` field; on by default, off here to save bandwidth.
logs: false
