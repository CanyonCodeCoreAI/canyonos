# Global Controller Configuration
# Lists all agents that CanyonOS manages.

# Where every replica runs: `local` (this machine) or `EC2` (machines from `ec2:`).
provider: local

agents:
  - name: HelloAgent
    replicas: 1
    resources:
      cpu: 1
      memory: 512
    entrypoint: agents/hello_agent.py
    functions:
      - name: hello
        arguments:
          - name: name
            type: str
        returns:
          type: str

  - name: Workflow
    replicas: 1
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

endpoint:
  agent: Workflow
  method: main

poll_interval: 5

# Stream failure/log detail into each future's `logs` field; on by default, off here to save bandwidth.
logs: false

redis:
  host: localhost
  port: 6380
  db: 0

otel:
  destinations:
    - name: local
      protocol: http
      endpoint: http://host.docker.internal:3000
      headers: {}
