# Global Controller Configuration
# Lists all agents that CanyonOS manages.

agents:
  - name: HelloAgent
    replicas: 1
    redis_port: 6380
    instance_type: t3.micro
    resources:
      cpu: 1
      memory: 512
    entrypoint: agents/hello_agent.py
    functions:
      - name: hello
        arguments:
          - name: name
            type: str
        returns:
          type: str
    provider: local

  - name: Workflow
    replicas: 1
    redis_port: 6380
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict
    provider: local

endpoint:
  api_port: 8082 # Defaults to 8080 if not filled
  agent: Workflow
  method: main

dashboard_port: 8081 # Local dashboard's preferred port, defaults to 8081 if not filled

poll_interval: 5

# Stream failure/log detail into each future's `logs` field; on by default, off here to save bandwidth.
logs: false

redis:
  host: localhost
  port: 6380
  db: 0

otel:
  destinations:
    - name: local
      protocol: http
      endpoint: http://host.docker.internal:3000
      headers: {}
