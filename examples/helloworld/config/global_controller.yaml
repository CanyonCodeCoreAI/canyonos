# Global Controller Configuration
# Lists all agents and workflows that CanyonOS manages.

agents:
  - name: HelloAgent
    replicas: 1
    redis_port: 6379
    instance_type: t3.micro
    resources:
      cpu: 1
      memory: 512
    entrypoint: agents/hello_agent.py
    provider: local

  - name: Workflow
    replicas: 1
    type: workflow
    redis_port: 6379
    api_port: 8080 # Only needed for workflows, defaults to 8080 if not filled
    dashboard_port: 8081 # Local dashboard's preferred port, defaults to 8081 if not filled
    workflow_file: workflow/example_workflow.py
    provider: local

poll_interval: 5

# Stream failure/log detail into each future's `logs` field; off by default to avoid clogging bandwidth (see FUTURE_SCHEMA.md).
logs: false

redis:
  host: localhost
  port: 6379
  db: 0

otel:
  destinations:
    - name: local
      protocol: http
      endpoint: http://host.docker.internal:3000
      headers: {}
