# Where the project deploys: `docker` is Docker on this machine.
target: docker

# Where every replica runs: `local` (this machine), `ec2-pool` or `ec2-assign`.
# examples/helloworld-ec2-assign is this example set up for `ec2-assign`.
provider: local

# The agents CanyonOS runs.
agents:
  - name: HelloAgent
    resources:
      cpu: 1
      memory: 512
    entrypoint: agents/hello_agent.py
    functions:
      - name: hello
        arguments:
          - name: name
            type: str
        returns:
          type: str

  - name: Workflow
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

endpoint:
  agent: Workflow
  method: main

# Stream failure/log detail into each future's `logs` field; on by default, off here to save bandwidth.
logs: false
