# The settings every project of the deployment shares. Each project's agents and
# routes are in its config/workflow_config.yaml.

# Where the deployment runs: `docker` is Docker on this machine.
target: docker

# Where every replica runs: `local` (this machine) or `ec2-pool` (machines from `ec2-pool:`).
provider: local

# Machines for `provider: ec2-pool`.
# ec2-pool:
#   region: ${EC2_REGION}
#   machine_type:          # how many machines of each type the deploy starts
#     t3.micro: 3
#   subnet_id: ${EC2_SUBNET_ID}
#   security_group_ids:
#     - ${EC2_SECURITY_GROUP_ID}

# Polling interval in seconds
poll_interval: 4
