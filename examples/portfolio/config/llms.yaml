# Model access — portfolio-analysis pipeline
# Keyed by a label for each model. An agent missing from a model's agents list is
# refused; a model not listed here is open to every agent. A cap is the most one
# call may cost in US dollars, checked against its worst case before sending.
#
# IntentAgent and AdvisorAgent call OpenAI with OPENAI_MODEL_ID, which defaults
# to this model. Neither is capped, so the list restricts access without refusing
# any call the pipeline makes today, and max_tokens goes unread until one is.

gpt-4o-mini:
  model_id: gpt-4o-mini
  max_tokens: 400
  agents:
    IntentAgent:
    AdvisorAgent:
