# Global Controller Configuration — portfolio-analysis fan-out pipeline
# Lists all agents that CanyonOS manages, and the one the endpoint serves.
#
# The pipeline fans out per-ticker metrics computation, then aggregates into
# portfolio-level risk, then generates an LLM briefing. Resource classes below
# reflect each stage's real cost so the scheduler has placement decisions to make.

# Where every replica runs: `local` (this machine) or `EC2` (machines from `ec2:`).
provider: local

agents:
  # Stage 0: parse the free-text request into structured holdings + lookback
  # window (calls Baseten via the openai SDK, routed through the CanyonOS LLM gateway). Cheap CPU, one
  # call per request, on the critical path before the fan-out.
  - name: IntentAgent
    replicas: 1
    resources:
      cpu: 1
      memory: 256
      gpu: 0
    entrypoint: agents/intent_agent.py
    requirements: [openai]
    functions:
      - name: parse
        arguments:
          - name: query
            type: str
        returns:
          type: dict

  # Stage 0b: price history fetch. Network/IO-bound, cheap CPU. Called by
  # MetricsAgent, one fetch per ticker — high fan-out, so multiple replicas.
  - name: PriceAgent
    replicas: 1
    resources:
      cpu: 1
      memory: 256
      gpu: 0
    entrypoint: agents/price_agent.py
    requirements: [yfinance]
    functions:
      - name: get_history
        arguments:
          - name: ticker
            type: str
          - name: lookback_days
            type: int
        returns:
          type: dict

  # Stage 1: per-ticker metrics. Cheap CPU, high fan-out (one call per holding).
  # Calls PriceAgent remotely, then computes return/vol/Sharpe/drawdown.
  - name: MetricsAgent
    replicas: 1
    resources:
      cpu: 1
      memory: 256
      gpu: 0
    entrypoint: agents/metrics_agent.py
    functions:
      - name: compute
        arguments:
          - name: ticker
            type: str
          - name: lookback_days
            type: int
        returns:
          type: dict

  # Stage 2: portfolio-level risk aggregation. Single call per request; needs
  # every ticker's metrics (the barrier).
  - name: RiskAgent
    replicas: 1
    resources:
      cpu: 1
      memory: 256
      gpu: 0
    entrypoint: agents/risk_agent.py
    functions:
      - name: assess
        arguments:
          - name: holdings
            type: dict
          - name: metrics
            type: dict
        returns:
          type: dict

  # Stage 3: LLM briefing via Baseten. On the critical path, one call per
  # request.
  - name: AdvisorAgent
    replicas: 1
    resources:
      cpu: 1
      memory: 512
      gpu: 0
    entrypoint: agents/advisor_agent.py
    requirements: [openai]
    functions:
      - name: summarize
        arguments:
          - name: holdings
            type: dict
          - name: metrics
            type: dict
          - name: risk
            type: dict
        returns:
          type: str

  # The agent the endpoint serves over HTTP; it calls the stages above.
  - name: Workflow
    replicas: 1
    resources:
      cpu: 1
      memory: 512
      gpu: 0
    entrypoint: agents/workflow.py
    functions:
      - name: main
        arguments:
          - name: query
            type: str
        returns:
          type: dict

  # Example: a shared Postgres state store (commented out, not used by this pipeline).
  # - name: StateDB
  #   type: database
  #   image: postgres:16-alpine
  #   db_port: 5432
  #   volume_path: /var/lib/postgresql/data
  #   env:
  #     POSTGRES_USER: username
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: canyonos_state_db

endpoint:
  agent: Workflow
  method: main

otel:
  # The dashboard api's own OTLP ingest. Base url only -- the exporter appends the
  # per-signal path (/v1/traces, /v1/metrics, /v1/logs) to whatever is set here.
  destinations:
    - name: local
      protocol: http
      endpoint: http://host.docker.internal:3000
      headers: {}

# Polling interval in seconds
poll_interval: 4
logs: true

redis:
  host: localhost
  db: 0

# Machines for `provider: EC2`.
ec2:
  region: ${EC2_REGION}
  machine_type:          # how many machines of each type the deploy starts
    t3.micro: 3
  subnet_id: ${EC2_SUBNET_ID}
  security_group_ids:
    - ${EC2_SECURITY_GROUP_ID}

