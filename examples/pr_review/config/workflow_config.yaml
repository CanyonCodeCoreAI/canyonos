# Workflow config — pull request review pipeline

# Where the project deploys: `docker` is Docker on this machine.
target: docker

# Where every replica runs: `local` (this machine), `ec2-pool` or `ec2-assign`.
provider: local

# The agents CanyonOS runs, and below them the one the endpoint serves.
agents:
  - name: TestRunnerAgent
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/test_runner_agent.py
    functions:
      - name: run
        arguments:
          - name: pr
            type: dict
        returns:
          type: dict

  - name: ReviewAgent
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/review_agent.py
    requirements:
      - boto3>=1.43.91,<2.0
    functions:
      - name: review
        arguments:
          - name: pr
            type: dict
          - name: tests
            type: str
        returns:
          type: str

  - name: MergeAgent
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/merge_agent.py
    functions:
      - name: merge
        arguments:
          - name: pr
            type: dict
          - name: review
            type: str
        returns:
          type: dict

  # The agent the endpoint serves over HTTP; it calls the agents above.
  - name: Workflow
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/workflow.py
    functions:
      - name: review
        arguments:
          - name: pr
            type: dict
        returns:
          type: dict

endpoint:
  agent: Workflow
  method: review

# Polling interval in seconds
poll_interval: 4
