name: sonarqube

services:
  postgres:
    image: postgres:17.6-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${SONARQUBE_POSTGRES_PASSWORD:?set in /etc/sonarqube/sonarqube.env}
    volumes:
      - sonarqube-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonarqube -d sonarqube']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:9000:9000'
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONARQUBE_POSTGRES_PASSWORD:?set in /etc/sonarqube/sonarqube.env}
      SONAR_AUTH_JWTBASE64HS256SECRET: ${SONARQUBE_JWT_SECRET:?set in /etc/sonarqube/sonarqube.env}
      SONAR_FORCEAUTHENTICATION: 'true'
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    security_opt:
      - no-new-privileges:true

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-postgresql-data:
